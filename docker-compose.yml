# ============================================================================
# FW-Websocket — Lyvion Framework Realtime Server (Portainer REPOSITORY-Stack)
# ============================================================================
#
# Standalone Repo. Eigenes GitHub-Repository, separat vom Framework-Hauptrepo.
# Wird auf einem Docker-Host (Portainer) deployed; das Framework verbindet
# sich via HTTPS-Reverse-Proxy mit diesem Container.
#
# Eine ausführliche Anleitung mit dem für DEINE Installation passenden Secret
# und allen Domain-Werten findest du im Framework selbst unter:
#   Einstellungen → System → ⚡ WebSocket → 📖 Installations-Anleitung
#
# ─── Quick-Deploy via Portainer Repository-Mode ──────────────────────────
#   Portainer → Stacks → Add stack → Build method: "Repository"
#     Name             : framework-ws
#     Repository URL   : https://github.com/<owner>/FW-Websocket
#     Authentication   : AN falls Repo privat (GitHub-User + PAT)
#     Repository ref.  : refs/heads/main
#     Compose path     : docker-compose.yml          ← Root, nicht Subfolder
#
#   Dann unten Environment variables → "Advanced mode" → die im Framework-UI
#   gezeigten Werte eintragen (CORS_ORIGIN, API_URL, WS_INTERNAL_SECRET).
#   → "Deploy the stack". Portainer pullt das Repo, baut das Image aus dem
#   Dockerfile (Build-Kontext = Repo-Root) und startet den Container.
#
#   Erfolgs-Log : "WebSocket server running on 0.0.0.0:3001"
#   Health-Test : curl http://<docker-host>:3001/health → {"status":"ok"}
#
#   Code-Updates: Repo updaten → in Portainer "Pull and redeploy" klicken.
#
# ─── Reverse-Proxy für HTTPS / WSS ──────────────────────────────────────
#   Nginx-Proxy-Manager: Proxy Host anlegen, Source = host:3001,
#   "Websockets Support" anhaken → öffentliche URL ist dann wss://...
#   Manuelles Nginx-Snippet siehe Framework-UI (Anleitung Schritt 3).
# ============================================================================
services:
  framework-ws:
    build: .                       # Build-Kontext = dieses Verzeichnis (Dockerfile daneben)
    image: framework-ws:latest
    # STACK_NAME / EXTERNAL_PORT allow multiple instances of this server to
    # coexist on the same Docker host (e.g. one prod + one test). Each stack
    # MUST pick a unique STACK_NAME and a unique EXTERNAL_PORT.
    # Defaults: framework-ws / 3001 — fine for the very first installation.
    container_name: ${STACK_NAME:-framework-ws}
    restart: unless-stopped
    ports:
      # External host port : internal container port (always 3001)
      - "${EXTERNAL_PORT:-3001}:3001"
    environment:
      # All values support Portainer Stack Environment Variables.
      # Syntax ${VAR:-default} → Portainer (or local .env) overrides default.
      # In the Framework Admin UI (Einstellungen → System → WebSocket →
      # Installations-Anleitung → Tab "Portainer Stack") you'll find an
      # auto-generated table with every variable + the exact value to paste.
      # WS_PORT inside the container ALWAYS stays 3001 — the published port
      # is controlled by EXTERNAL_PORT above. Keep this default unless you
      # really know what you're doing.
      WS_PORT: "3001"
      WS_HOST: "${WS_HOST:-0.0.0.0}"
      # CORS_ORIGIN: Browser-Origin(s) allowed to open a WebSocket.
      # Single-site:  "https://your-framework.example.com"
      # Multi-site:   "https://site-a.example.com,https://site-b.example.com"
      # NEVER leave on "*" in production — that disables CORS entirely.
      CORS_ORIGIN: "${CORS_ORIGIN:-https://your-framework.example.com}"
      # API_URL: Framework PHP API the WS server calls for token validation.
      # In multi-site setups: exactly ONE framework instance — that's the
      # authoritative one for auth. Other sites must share the SAME
      # WS_INTERNAL_SECRET (their own framework/data/.ws-internal-secret).
      API_URL: "${API_URL:-https://your-framework.example.com/framework}"
      # WS_INTERNAL_SECRET: shared secret with the framework. Copy from:
      # Framework → Einstellungen → System → WebSocket → "Internal Secret".
      # Leave EMPTY to fall back to legacy loopback auth (only works when
      # WS container and framework run on the same Docker host).
      WS_INTERNAL_SECRET: "${WS_INTERNAL_SECRET:-}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
