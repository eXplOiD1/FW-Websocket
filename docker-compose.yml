# ============================================================================
# Framework WebSocket-Server — Portainer REPOSITORY-Stack (Image-Build)
# ============================================================================
#
# WICHTIG: KEIN Bind-Mount. Der Code wird via Dockerfile INS IMAGE kopiert,
# darum ist KEINE Datei auf dem Docker-Host nötig. Das vorherige ENOENT
# (/app/package.json fehlt) kam vom leeren Host-Mount — der ist hier weg.
#
# So deployen:
#  1. Diese Datei + das Dockerfile (beide in framework/websocket-server/)
#     müssen im GitHub-Repo liegen (per GitHub-Uploader hochladen).
#  2. Portainer → Stacks → Add stack → Build method: "Repository"
#       Repository URL : <deine echte GitHub-Repo-URL>
#       Authentication : AN falls privat (GitHub-User + Personal Access Token)
#       Reference      : refs/heads/main   (oder dein Branch)
#       Compose path   : framework/websocket-server/docker-compose.yml
#  3. Env unten anpassen (API_URL / CORS_ORIGIN) → "Deploy the stack".
#     Portainer klont das Repo, Docker baut das Image aus dem Dockerfile
#     (Build-Kontext = framework/websocket-server/) und startet es.
#
#  Erfolg im Container-Log: "WebSocket server running on 0.0.0.0:3001"
#  Test auf dem Host:       curl http://localhost:3001/health → {"status":"ok"}
#
#  Bei Code-Updates: Datei(en) ins Repo pushen → in Portainer den Stack
#  "Pull and redeploy" (baut das Image neu).
#
#  DB ist für den Push-Test NICHT nötig (On-Connect-Notification-Fehler
#  wird nur geloggt). Danach noch: wss-Reverse-Proxy (nginx-proxy-manager,
#  "Websockets Support" anhaken) → öffentliche https-URL in
#  Einstellungen → System → ⚡ WebSocket eintragen.
# ============================================================================
services:
  framework-ws:
    build: .                       # Build-Kontext = dieses Verzeichnis (Dockerfile daneben)
    image: framework-ws:latest
    container_name: framework-ws
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      WS_PORT: "3001"
      WS_HOST: "0.0.0.0"
      CORS_ORIGIN: "https://img.deuba24.com"
      API_URL: "https://img.deuba24.com/tools/framework"
      LOG_LEVEL: "info"
